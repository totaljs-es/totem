name: rebuild

# The website is published by the workflow pages.yml of the branch main (it checks out this branch). A change here asks for it, because the workflows that
# a push to this branch runs are the ones of this branch.

on:
  push:
    branches: [site]

permissions:
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
