name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # The workflow that publishes a release runs the same tests first
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/run.js

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the image
        run: docker build -t totem:test .
      - name: Smoke test (needs a token, serves a mounted project, opens a shell)
        run: node scripts/docker-smoke.js totem:test
