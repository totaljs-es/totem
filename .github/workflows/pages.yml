name: website

# The website (https://totaljs-es.github.io/totem/) is made from two branches: the pages of the documentation are in main (docs/, the changelog, the version) and
# everything else (templates, styles, images, the script that builds it) is in the branch site, apart from the application. See "The website" in docs/delivery.md.
# Set up once: Settings, Pages, Source: GitHub Actions. A push to the branch site runs this workflow too (the workflow of that branch asks for it).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The application (the text of the pages)
        uses: actions/checkout@v7
        with:
          path: app

      - name: The website
        uses: actions/checkout@v7
        with:
          ref: site
          path: site

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Every page, link, image and section: a problem stops the build
      - run: node site/scripts/build-site.js --app app --out dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
