<style>
	.CLASS { height: 100vh; display: flex; flex-direction: column; }
	.CLASS .top { padding: 14px 14px 6px; display: flex; align-items: center; gap: 10px; }
	.CLASS .top b { flex: 1; font-size: 18px; font-weight: 600; letter-spacing: 0.1px; }
	.CLASS .sidenav { padding: 6px 8px 2px; display: flex; flex-direction: column; gap: 1px; }
	.CLASS .sidenav .item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius, 10px); cursor: pointer; font-size: 14px; }
	.CLASS .sidenav .item:hover { background: var(--t-soft); }
	.CLASS .sidenav .item i { font-size: 17px; color: var(--t-muted); }
	.CLASS .list { flex: 1; overflow: auto; padding: 10px 8px; }
	.CLASS .project { padding: 6px 10px; margin-top: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: var(--radius, 10px); color: var(--t-muted); font-size: 13px; }
	.CLASS .project:hover { background: var(--t-soft); }
	.CLASS .project .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.CLASS .project .path { display: none; }
	.CLASS .project .more { opacity: 0; color: var(--t-muted); padding: 2px 5px; border-radius: 6px; }
	.CLASS .project .more:hover, .CLASS .session .more:hover { background: var(--t-soft2); color: var(--t-text); }
	.CLASS .project:hover .more { opacity: 1; }
	.CLASS .session { margin: 1px 0; padding: 7px 10px; border-radius: var(--radius, 10px); cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 14px; }
	.CLASS .session:hover { background: var(--t-soft); }
	.CLASS .session.selected { background: var(--t-soft2); }
	.CLASS .session .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: transparent; }
	.CLASS .session .dot.running { background: var(--t-live); animation: totemlive 1.4s infinite ease-in-out; }
	.CLASS .session .dot.error { background: #D63A32; }
	@keyframes totemlive { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .CLASS .session .dot.running { animation: none; } }
	.CLASS .session .more { opacity: 0; color: var(--t-muted); padding: 2px 5px; border-radius: 6px; }
	.CLASS .session:hover .more { opacity: 1; }
	.CLASS .session span.title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.CLASS .foot { padding: 8px; border-top: 1px solid var(--t-border); display: flex; gap: 8px; }
	.CLASS .foot .tbtn { height: 36px; }
	.CLASS .empty-note { padding: 20px 16px; color: var(--t-muted); text-align: center; }
</style>

<ui-plugin class="CLASS">

	<div class="top">
		<img class="logo-light" src="/img/totem-light.svg" alt="" width="28" height="28" /><img class="logo-dark" src="/img/totem-dark.svg" alt="" width="28" height="28" />
		<b class="serif">Totem</b>
	</div>

	<div class="sidenav">
		<div class="item exec" data-exec="?/newcurrent"><i class="ti ti-plus"></i>@(New session)</div>
		<div class="item exec" data-exec="?/open"><i class="ti ti-folder-plus"></i>@(Open a folder)</div>
		<div class="item exec" data-exec="?/schedules"><i class="ti ti-clock"></i>@(Scheduled prompts)</div>
	</div>

	<div class="list">
		<ui-component name="empty" path="?.items" config="parent:auto">
			<script type="text/html">
				<div class="empty-note"><i class="ti ti-folder-plus" style="font-size:28px"></i><div class="mt10">@(No projects yet. Open a folder to start.)</div></div>
			</script>
			<ui-bind path="?.items" config="template" class="block">
				<script type="text/html">
					{{ foreach m in value }}
					<div class="exec project" data-exec="?/project" data-id="{{ m.id }}">
						<i class="ti ti-folder"></i>
						<div style="flex:1;min-width:0">
							<div class="name">{{ m.name }}</div>
							<div class="path">{{ m.path | shortpath }}</div>
						</div>
						<span class="exec more" data-exec="?/newsession" data-prevent="true" title="@(New session)" aria-label="@(New session)"><i class="ti ti-plus"></i></span>
						<span class="exec more" data-exec="?/menu" data-prevent="true" title="@(Options)" aria-label="@(Options)"><i class="ti ti-ellipsis-h"></i></span>
					</div>
					{{ if m.sessions }}
					{{ foreach s in m.sessions }}
					<div class="exec session{{ if s.id === common.sessionid }} selected{{ fi }}" data-exec="?/session" data-id="{{ s.id }}" data-project="{{ m.id }}">
						<span class="dot{{ if s.status === 'running' }} running{{ fi }}{{ if s.status === 'error' }} error{{ fi }}" title="{{ s.status }}"></span>
						<span class="title">{{ s.name }}</span>
						<span class="exec more" data-exec="?/sessionmenu" data-prevent="true" data-id="{{ s.id }}" data-project="{{ m.id }}" title="@(Options)"><i class="ti ti-ellipsis-h"></i></span>
					</div>
					{{ end }}
					{{ fi }}
					{{ end }}
				</script>
			</ui-bind>
		</ui-component>
	</div>

	<div class="foot">
		<button class="tbtn tbtn-ghost exec" data-exec="?/settings" style="flex:1;justify-content:flex-start"><i class="ti ti-settings"></i>@(Settings)</button>
	</div>

</ui-plugin>

<script>

	PLUGIN(function(exports) {

		var wired = false;

		exports.reload = function() {

			// Right click opens the same menu as the dots; a double click on a session renames it
			if (!wired) {
				wired = true;
				var list = document.querySelector('.CLASS .list') || document.querySelector('.list');
				list && list.addEventListener('contextmenu', function(e) {
					var row = e.target.closest('.session, .project');
					var dots = row && row.querySelector('[data-exec$="/sessionmenu"], [data-exec$="/menu"]');
					if (dots) {
						e.preventDefault();
						dots.click();
					}
				});
				list && list.addEventListener('dblclick', function(e) {
					var row = e.target.closest('.session');
					row && exports.rename(row.getAttribute('data-id'));
				});
			}

			exports.refresh();
		};

		exports.rename = function(id) {
			var current = '';
			(exports.model.items || []).forEach(p => (p.sessions || []).forEach(s => s.id === id && (current = s.name)));
			exports.askname('@(Rename session)', current, function(name) {
				if (name && name.trim())
					exports.tapi('sessions_update/' + id + ' ERROR', { name: name.trim() }, () => exports.refresh());
			}, '@(Type the new name.)');
		};

		exports.refresh = function() {
			exports.tapi('providers_catalog', function(catalog) {

				// model -> icon and name of its provider, for the sessions
				var providers = {};
				catalog.forEach(m => providers[m.id] = m);

				exports.tapi('projects', function(projects) {
					var pending = projects.length;
					if (!pending) {
						exports.set('items', projects);
						return;
					}
					projects.forEach(function(project) {
						exports.tapi(QUERIFY('sessions', { projectid: project.id }), function(sessions) {
							sessions.forEach(function(s) {
								var m = providers[s.model];
								s.icon = m ? m.icon : '';
								s.provider = m ? m.provider : '';
							});
							project.sessions = sessions;
							if (!--pending)
								exports.set('items', projects);
						});
					});
				});
			});
		};

		exports.open = function() {
			SET('formproject @default', { path: '' });
			SET('common.form', 'formproject');
		};

		// A click on a project opens its latest session; a project without sessions gets one
		exports.project = function(el) {

			var id = typeof(el) === 'string' ? el : ATTRD(el);
			var project = (exports.model.items || []).findItem('id', id);

			if (project && project.sessions && project.sessions.length)
				exports.session(project.sessions[0].id, id);
			else
				exports.create(id);
		};

		exports.newsession = function(el) {
			exports.create(el.closest('.project').attrd('id'));
		};

		// Creates a session in a project; the name is optional, without one the first prompt names it
		exports.create = function(id, name, worktree) {
			// The new session starts with the model that is chosen in the chat
			var model = (PLUGINS.chat && PLUGINS.chat.model && PLUGINS.chat.model.model) || '';
			exports.tapi('sessions_create ERROR', { projectid: id, model: model, name: typeof(name) === 'string' ? name : '', worktree: !!worktree }, function(response) {
				exports.refresh();
				exports.session(response.id, id);
			});
		};

		exports.session = function(el, projectid) {
			var id = typeof(el) === 'string' ? el : ATTRD(el);
			projectid = (typeof(projectid) === 'string' && projectid) || el.attrd('project');
			SET('common.projectid', projectid);
			SET('common.sessionid', id);
			$('.app').removeClass('side-open');
			PLUGINS.chat && PLUGINS.chat.open(id);
			exports.refresh();
		};

		exports.menu = function(el) {
			var id = el.closest('.project').attrd('id');
			var opt = {};
			opt.element = el;
			opt.align = 'right';
			opt.items = [];
			opt.items.push({ id: 'session', name: '@(New session)', icon: 'ti ti-plus' });
			opt.items.push({ id: 'named', name: '@(New session with a name)', icon: 'ti ti-pencil-alt' });
			opt.items.push({ id: 'worktree', name: '@(New session in a git worktree)', icon: 'ti ti-code-branch' });
			opt.items.push('-');
			opt.items.push({ id: 'remove', name: '@(Remove folder from the list)', icon: 'ti ti-trash red' });
			opt.callback = function(item) {
				if (item.id === 'session')
					exports.create(id);
				else if (item.id === 'worktree')
					exports.create(id, '', true);
				else if (item.id === 'named')
					exports.askname('@(New session)', '', name => exports.create(id, name));
				else if (item.id === 'remove') {
					SETTER('approve/show', '@(Forget this project and its sessions? The files are not touched.)', ':ti ti-trash: @(Forget)', function() {
						exports.tapi('projects_remove/' + id + ' ERROR', function() {
							if (common.projectid === id) {
								SET('common.projectid', null);
								SET('common.sessionid', null);
								PLUGINS.chat && PLUGINS.chat.open(null);
							}
							exports.refresh();
						});
					});
				}
			};
			SETTER('menu/show', opt);
		};

		// A window with the name: an empty name is the default one
		exports.askname = function(title, value, callback, summary) {
			var opt = {};
			opt.name = title;
			opt.summary = summary || '@(Leave it empty for the default name: the session is named after your first prompt.)';
			opt.value = value || '';
			opt.newbie = true;
			opt.callback = callback;
			SETTER('prompt/show', opt);
		};

		// Rename and delete a session
		exports.sessionmenu = function(el) {

			var id = el.attrd('id');
			var opt = {};
			opt.element = el;
			opt.align = 'right';
			opt.items = [];
			opt.items.push({ id: 'rename', name: '@(Rename)', icon: 'ti ti-pencil' });
			opt.items.push({ id: 'fork', name: '@(Fork)', icon: 'ti ti-code-branch' });
			opt.items.push('-');
			opt.items.push({ id: 'remove', name: '@(Delete session)', icon: 'ti ti-trash red' });
			opt.callback = function(item) {

				if (item.id === 'rename') {

					exports.rename(id);

				} else if (item.id === 'fork') {

					exports.tapi('sessions_fork/' + id + ' ERROR', {}, function(session) {
						exports.refresh();
						SET('common.sessionid', session.id);
						PLUGINS.chat && PLUGINS.chat.open(session.id);
					});

				} else if (item.id === 'remove') {

					SETTER('approve/show', '@(Delete this session and its messages? The files of the project are not touched.)', ':ti ti-trash: @(Delete)', function() {
						exports.tapi('sessions_remove/' + id + ' ERROR', function() {
							if (common.sessionid === id) {
								SET('common.sessionid', null);
								PLUGINS.chat && PLUGINS.chat.open(null);
							}
							exports.refresh();
						});
					});
				}
			};

			SETTER('menu/show', opt);
		};

		// A new session in the project that is open, or in the first one
		exports.newcurrent = function() {
			var items = (exports.model || {}).items || [];
			var id = (window.common && common.projectid) || (items[0] && items[0].id);
			if (id)
				exports.create(id);
			else
				exports.open();
		};

		exports.settings = function() {
			SET('common.form', 'formsettings');
		};

		exports.schedules = function() {
			SET('common.form', 'formschedules');
		};

	});

</script>
