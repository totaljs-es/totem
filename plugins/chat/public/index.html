<style>
	.CLASS { height: 100vh; display: flex; flex-direction: column; }
	.CLASS .bar { padding: 8px 16px; border-bottom: 1px solid var(--t-border); display: flex; gap: 6px; align-items: center; min-height: 52px; }
	.CLASS .bar b { font-size: 16px; font-weight: 600; }
	.CLASS .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--t-muted); margin-right: 6px; }
	.CLASS .state.err { color: #D63A32; }
	.CLASS .state .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--t-live); animation: totemlive 1.4s infinite ease-in-out; }
	@keyframes totemlive { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .CLASS .state .pulse { animation: none; } }
	.CLASS .bar > * { flex: 0 0 auto; }
	.CLASS .bar b { flex: 1 1 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.CLASS .meter { font-size: 12px; color: var(--t-muted); white-space: nowrap; }
	.CLASS .layout { flex: 1; display: flex; min-height: 0; }
	.CLASS .layout .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
	.CLASS .scroll { flex: 1; overflow: auto; padding: 18px 16px 30px; }
	.CLASS .inner { max-width: 860px; margin: 0 auto; }
	.CLASS .msg { margin-bottom: 20px; }
	.CLASS .msg-user { text-align: right; }
	.CLASS .msg-user .bubble { background: var(--t-soft2); border-radius: 14px 14px 4px 14px; padding: 8px 14px; display: inline-block; max-width: 85%; text-align: left; white-space: pre-wrap; }
	.CLASS .waiting { display: flex; gap: 5px; padding: 6px 2px 14px; }
	.CLASS .waiting span { width: 7px; height: 7px; border-radius: 50%; background: var(--t-muted); opacity: 0.3; animation: totemwait 1.2s infinite ease-in-out; }
	.CLASS .waiting span:nth-child(2) { animation-delay: 0.2s; }
	.CLASS .waiting span:nth-child(3) { animation-delay: 0.4s; }
	@keyframes totemwait { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.1); } }
	@media (prefers-reduced-motion: reduce) { .CLASS .waiting span { animation: none; opacity: 0.6; } }
	.CLASS .mode { width: 128px; }
	.CLASS .gitbox { border: 1px solid var(--t-border); border-radius: var(--radius, 6px); padding: 8px 10px; margin-bottom: 12px; font-size: 12px; background: var(--t-soft); }
	.CLASS .gittop { margin-bottom: 6px; }
	.CLASS .gitwt { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--t-border); }
	.CLASS .gitfile { padding: 1px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.CLASS .termhead { font-weight: bold; font-size: 12px; margin-bottom: 6px; color: var(--t-muted); }
	.CLASS .termjob { margin-bottom: 12px; font-size: 12px; }
	.CLASS .termcmd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
	.CLASS .termcmd b { font-family: monospace; word-break: break-all; }
	.CLASS .termout { background: #1B1D1B; color: #D8DAD8; border-radius: var(--radius, 6px); padding: 8px 10px; margin: 4px 0 0; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
	.CLASS .termbox:has(.termjob) .termnote { display: none; }
	.CLASS .shellbox { margin-bottom: 16px; }
	.CLASS .shellbox .shellout { min-height: 120px; max-height: 360px; font-family: monospace; }
	.CLASS .shellbox .shellrow { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
	.CLASS .shellbox .shellinput { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border: 1px solid var(--t-border); border-radius: var(--radius, 6px); background: var(--t-card); color: inherit; font-family: monospace; font-size: 12px; }
	.CLASS .shellbox .shellrow .tbtn { flex: 0 0 auto; }
	.CLASS .part { margin-bottom: 8px; }
	.CLASS .part.live { white-space: pre-wrap; overflow-wrap: anywhere; }
	.CLASS .markdown-code { position: relative; }
	.CLASS .saveblock { position: static; margin: 6px 0 12px; height: 28px; padding: 0 10px; border: 1px solid var(--t-border); border-radius: var(--radius, 6px); background: var(--t-card); color: var(--t-muted); cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; }
	.CLASS .saveblock:hover { color: inherit; }
	.CLASS .copycode { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; padding: 0; border: 1px solid var(--t-border); border-radius: var(--radius, 6px); background: var(--t-card); color: var(--t-muted); cursor: pointer; opacity: 0; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; }
	.CLASS .markdown-code:hover .copycode, .CLASS .copycode:focus-visible { opacity: 0.9; }
	.CLASS .copycode:hover { color: inherit; opacity: 1; }
	@media (hover: none) { .CLASS .copycode { opacity: 0.8; } }
	.CLASS .part pre { background: var(--t-soft); color: inherit; border: 1px solid var(--t-border); border-radius: var(--radius, 6px); padding: 10px 12px; overflow: auto; font-size: 12px; }
	.CLASS .part pre code, .CLASS .part code { background: transparent; color: inherit; }
	.CLASS .part :not(pre) > code { background: var(--t-soft2); padding: 1px 5px; border-radius: 4px; }
	.CLASS .scroll { overflow-anchor: none; }
	.CLASS .reasoning { color: var(--t-muted); border-left: 3px solid var(--t-border); padding-left: 10px; font-size: 13px; }
	.CLASS .reasoning summary { cursor: pointer; font-style: italic; }
	.CLASS .tool { border: 1px solid var(--t-border); border-radius: var(--radius, 6px); padding: 6px 10px; font-size: 13px; background: var(--t-soft); }
	.CLASS .tool summary { cursor: pointer; display: flex; gap: 8px; align-items: center; }
	.CLASS .tool pre { margin: 6px 0 0; max-height: 260px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
	.CLASS .tool .st-done { color: #27AE60; }
	.CLASS .tool .st-error, .CLASS .tool .st-denied { color: #D63A32; }
	.CLASS .tool .st-running, .CLASS .tool .st-pending { color: #E67E22; }
	.CLASS .ask { margin-bottom: 12px; font-size: 13px; }
	.CLASS .ask b { font-size: 14px; }
	.CLASS .ask code { display: block; margin: 8px 0; white-space: pre-wrap; background: var(--t-soft); padding: 6px 8px; border-radius: var(--radius, 6px); }
	.CLASS .ask .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
	.CLASS .ask.question { border-color: #3498DB; color: inherit; }
	.CLASS .ask input[type=text] { flex: 1; min-width: 160px; height: 30px; padding: 0 10px; border: 1px solid var(--t-border); border-radius: var(--radius, 6px); background: var(--t-card); color: inherit; }
	.CLASS .empty { text-align: center; color: var(--t-muted); margin-top: 16vh; font-family: ui-serif, "Iowan Old Style", Palatino, Georgia, serif; font-size: 17px; }
	.CLASS .empty img { opacity: 0.9; margin-bottom: 14px; }
	.CLASS .chips { max-width: 860px; margin: 0 auto 6px; padding: 0 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
	.CLASS .chip { cursor: pointer; border: 1px solid var(--t-border); border-radius: 12px; padding: 1px 10px; font-size: 12px; }
	.CLASS .chip:hover { background: var(--t-soft); }
	.CLASS .todos { max-width: 860px; margin: 0 auto 8px; padding: 0 16px; font-size: 13px; }
	.CLASS .todos div { padding: 1px 0; }
	.CLASS .todos .completed { color: var(--t-muted); text-decoration: line-through; }
	.CLASS .todos .in_progress { font-weight: bold; }
	.CLASS .compose { padding: 6px 16px 16px; }
	.CLASS .compose .card { max-width: 860px; margin: 0 auto; border: 1px solid var(--t-border); border-radius: 18px; background: var(--t-card); padding: 10px 12px; box-shadow: 0 1px 2px rgba(60,50,20,0.05), 0 8px 24px rgba(60,50,20,0.06); }
	.CLASS .compose .row { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; }
	.CLASS .compose .row.opts { flex-wrap: wrap; margin-top: 6px; }
	.CLASS .compose .send { border-radius: 50%; }
	.CLASS .compose .card .ui-input-control { border: 0 !important; background: transparent !important; box-shadow: none !important; }
	.CLASS .compose .row:not(.opts) .ui-input-control { font-size: 15px; }
	.CLASS .compose .row.opts .ui-input-control { border: 1px solid transparent !important; border-radius: 999px; padding-left: 4px; height: 30px; }
	.CLASS .compose .row.opts .ui-input-control:hover { background: var(--t-soft2) !important; }
	.CLASS .compose .row.opts .ui-input-icon-right { border-left: 0 !important; background: transparent !important; width: 22px; }
	.CLASS .compose .row.opts .ui-input-ricon { padding-right: 22px !important; }
	.CLASS .compose .row.opts .ui-input-input, .CLASS .compose .row.opts .ui-input-value { font-size: 13px; color: var(--t-muted); }
	.CLASS .compose .row.opts .send { margin-left: auto; }
	.CLASS .compose .row .tbtn { flex: 0 0 auto; }
	.CLASS .attached { max-width: 860px; margin: 0 auto 8px; display: flex; gap: 8px; flex-wrap: wrap; }
	.CLASS .attached .item { border: 1px solid var(--t-border); border-radius: var(--radius, 6px); padding: 3px 6px 3px 3px; display: flex; gap: 6px; align-items: center; font-size: 12px; background: var(--t-card); max-width: 220px; }
	.CLASS .attached .item img { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; }
	.CLASS .attached .item span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.CLASS .files { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
	.CLASS .files img { max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--t-border); display: block; }
	.CLASS .files a.chip { text-decoration: none; color: inherit; }
	.CLASS .compose .grow { flex: 1 1 220px; min-width: 160px; }
	.CLASS .compose .model { width: 200px; }
	.CLASS .note { text-align: center; font-size: 12px; color: var(--t-muted); margin: 10px 0; }
	.CLASS .undo { font-size: 12px; margin-top: 4px; }
	.CLASS .link, .CLASS .note a { color: var(--t-muted); text-decoration: none; cursor: pointer; }
	.CLASS .link:hover, .CLASS .note a:hover { color: var(--t-text); text-decoration: underline; }
	.CLASS .part a { color: var(--t-text); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--t-muted); }
	.CLASS .side { width: 380px; flex: 0 0 380px; border-left: 1px solid var(--t-border); overflow: auto; padding: 12px; background: var(--t-side); }
	.CLASS .file { margin-bottom: 10px; border: 1px solid var(--t-border); border-radius: var(--radius, 6px); overflow: hidden; background: var(--t-card); }
	.CLASS .file summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: center; background: var(--t-soft); }
	.CLASS .file summary b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.CLASS .file pre { margin: 0; padding: 6px 0; overflow: auto; font-size: 12px; max-height: 360px; }
	.CLASS .file pre span { display: block; padding: 0 10px; white-space: pre; }
	.CLASS .file pre .add { background: var(--t-add); }
	.CLASS .file pre .del { background: var(--t-del); }
	.CLASS .file pre .hunk { color: var(--t-muted); background: var(--t-soft); }
	.CLASS .side.wide { width: min(780px, 62%); flex-basis: min(780px, 62%); }
	.CLASS .split { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; font-family: Menlo, Consolas, monospace; }
	.CLASS .split td { padding: 0 6px; vertical-align: top; }
	.CLASS .split td.n { width: 36px; text-align: right; color: var(--t-muted); user-select: none; }
	.CLASS .split td.c { white-space: pre-wrap; word-break: break-all; width: 50%; }
	.CLASS .split td.del { background: var(--t-del); }
	.CLASS .split td.add { background: var(--t-add); }
	.CLASS .split td.empty { background: var(--t-soft); }
	.CLASS .split tr.hunk td { color: var(--t-muted); background: var(--t-soft); }
	.CLASS .plus { color: #27AE60; }
	.CLASS .minus { color: #D63A32; }
</style>

<ui-plugin class="CLASS">

	<div class="bar">
		<button class="tbtn tbtn-ghost tbtn-icon only-mobile exec" data-exec="?/sidebar" title="@(Sessions)" aria-label="@(Sessions)"><i class="ti ti-bars"></i></button>
		<b class="serif"><ui-bind path="?.session" config="template" class="block"><script type="text/html">{{ if value }}{{ value.name }}{{ else }}@(No session){{ fi }}</script></ui-bind></b>
		<ui-bind path="?.status" config="template" class="inline"><script type="text/html">{{ if value === 'running' }}<span class="state live"><span class="pulse"></span>@(working)</span>{{ fi }}{{ if value === 'error' }}<span class="state err">@(error)</span>{{ fi }}{{ if value === 'aborted' }}<span class="state">@(stopped)</span>{{ fi }}</script></ui-bind>
		<ui-bind path="?.items" config="template" class="inline"><script type="text/html"><span class="meter" title="@(Tokens used in this session)">{{ value | tokens }}</span></script></ui-bind>
		<ui-bind path="?.status" config="show:value === 'running'" class="hidden"><button class="tbtn exec" data-exec="?/abort" title="@(Stop, Esc)"><i class="ti ti-stop-alt"></i>@(Stop)</button></ui-bind>
		<ui-bind path="?.canredo" config="show:value" class="hidden"><button class="tbtn tbtn-ghost tbtn-icon exec" data-exec="?/redo" title="@(Put back the changes that were undone)" aria-label="@(Redo)"><i class="ti ti-redo"></i></button></ui-bind>
		<button class="tbtn tbtn-ghost exec" data-exec="?/changes" title="@(Files changed by Totem, Alt+D)" aria-label="@(Changes)"><i class="ti ti-exchange"></i><ui-bind path="?.files" config="template" class="inline"><script type="text/html">{{ if value && value.length }}{{ value.length }}{{ fi }}</script></ui-bind></button>
		<button class="tbtn tbtn-ghost tbtn-icon exec" data-exec="?/terminal" title="@(Commands that Totem ran)" aria-label="@(Terminal)"><i class="ti ti-terminal"></i></button>
		<button class="tbtn tbtn-ghost tbtn-icon exec" data-exec="?/more" title="@(More)" aria-label="@(More)"><i class="ti ti-ellipsis-h"></i></button>
	</div>

	<div class="layout">
	<div class="col">

	<div class="scroll" id="chatscroll">
		<div class="inner">

			<ui-bind path="?.session" config="template" class="block">
				<script type="text/html">
					{{ if !value }}
					<div class="empty">
						<img class="logo-light" src="/img/totem-light.svg" alt="" width="72" height="72" /><img class="logo-dark" src="/img/totem-dark.svg" alt="" width="72" height="72" />
						<div>@(Open a folder to start. Totem works inside the folder of a project.)</div>
						<div class="mt10"><button class="tbtn tbtn-primary exec" data-exec="?/folder"><i class="ti ti-folder-plus"></i>@(Open a folder)</button></div>
					</div>
					{{ fi }}
				</script>
			</ui-bind>

			<ui-bind path="?.items" config="template" class="block">
				<script type="text/html">
					{{ if value && !value.length }}
					<div class="empty"><img class="logo-light" src="/img/totem-light.svg" alt="" width="72" height="72" /><img class="logo-dark" src="/img/totem-dark.svg" alt="" width="72" height="72" /><div>@(Ask Totem to read, change or run something in this project.)</div></div>
					{{ fi }}
					{{ foreach m in value }}
					<div class="msg msg-{{ m.role }}">
						{{ foreach p in m.parts }}
							{{ if p.type === 'text' && m.role === 'user' }}
							<div class="bubble">{{ p.data.text }}</div>
							{{ fi }}
							{{ if p.type === 'text' && m.role !== 'user' }}
							<div class="part{{ if p.live }} live{{ fi }}" data-part="{{ p.id }}">{{ if p.live }}{{ p.data.text }}{{ else }}{{ p.data.text | markdown({ wrap: false }) }}{{ fi }}</div>
							{{ fi }}
							{{ if p.type === 'file' }}
							<div class="files">
								{{ if p.data.kind === 'image' }}<a href="/attachments/{{ p.data.id }}/" target="_blank" rel="noopener"><img src="/attachments/{{ p.data.id }}/" alt="{{ p.data.name }}" loading="lazy" /></a>{{ else }}<a class="chip" href="/attachments/{{ p.data.id }}/" target="_blank" rel="noopener"><i class="ti ti-file-alt"></i> {{ p.data.name }}</a>{{ fi }}
							</div>
							{{ fi }}
							{{ if p.type === 'knowledge' }}
							<div class="note"><i class="ti ti-book"></i> @(Knowledge used:) {{ p.data.pages | forgepages }}</div>
							{{ fi }}
							{{ if p.type === 'selfcheck' }}
							<div class="note"><i class="ti ti-check-circle"></i> @(Code reviewed before showing the final answer:) {{ p.data.rules.join(', ') }}</div>
							{{ fi }}
							{{ if p.type === 'validation' }}
							<div class="note{{ if p.data.blocking !== false }} validation{{ fi }}">@(This code still needs review. It has not been saved automatically.)</div>
							{{ fi }}
							{{ if p.type === 'compaction' }}
							<div class="note"><i class="ti ti-compress"></i> @(Earlier turns were summarized to keep the conversation short.)</div>
							{{ fi }}
							{{ if p.type === 'reasoning' }}
							<details class="part reasoning" data-part="{{ p.id }}"{{ if p.open }} open{{ fi }}><summary>@(Thinking)</summary><span class="rtext">{{ p.data.text }}</span></details>
							{{ fi }}
							{{ if p.type === 'tool' }}
							<div class="part">
								<details class="tool" data-part="{{ p.id }}"{{ if p.open }} open{{ fi }}>
									<summary><i class="ti ti-wrench"></i><b>{{ p.data.tool }}</b><span class="hellip" style="flex:1;color:#777">{{ p.data.input | json }}</span><span class="st-{{ p.data.status }}">{{ p.data.status }}</span></summary>
									{{ if p.data.tool === 'task' && p.data.thread && p.data.thread.length }}<div class="fs12" style="color:var(--t-muted);padding:4px 0"><i class="ti ti-users"></i> <b>{{ p.data.agent }}</b>{{ if p.data.model }} &middot; {{ p.data.model }}{{ fi }}</div><pre class="agentthread">{{ p.data.thread.join('\n') }}</pre>{{ fi }}
									{{ if p.data.output || p.data.error }}{{ if p.data.tool !== 'task' || p.data.status !== 'running' }}{{ if p.data.tool === 'task' && p.data.status === 'done' }}<div class="fs12" style="color:var(--t-muted)">@(Answer of the agent)</div>{{ fi }}<pre>{{ p.data.error || p.data.output }}</pre>{{ fi }}{{ fi }}
								</details>
							</div>
							{{ fi }}
						{{ end }}
						{{ if m.role === 'assistant' }}
						<div class="undo">{{ if m.changed }}<span class="exec link" data-exec="?/undo" data-id="{{ m.id }}"><i class="ti ti-undo"></i> @(Undo these changes)</span> &nbsp; {{ fi }}<span class="exec link" data-exec="?/fork" data-id="{{ m.id }}"><i class="ti ti-code-branch"></i> @(Fork from here)</span></div>
						{{ fi }}
					</div>
					{{ end }}
				</script>
			</ui-bind>

			<ui-bind path="?.status" config="show:value === 'running'" class="hidden"><div class="waiting" role="status" aria-label="@(Totem is working)"><span></span><span></span><span></span></div></ui-bind>

			<ui-bind path="?.asks" config="template" class="block">
				<script type="text/html">
					{{ foreach a in value }}
					<div class="message message-alert ask">
						<b><i class="ti ti-shield-alt"></i> @(Totem wants to use) {{ a.tool }}</b>
						<code>{{ a.text }}</code>
						<div class="row2">
							<button class="tbtn tbtn-primary exec" data-exec="?/reply" data-id="{{ a.id }}" data-reply="once"><i class="ti ti-check"></i>@(Allow once)</button>
							<button class="tbtn exec" data-exec="?/reply" data-id="{{ a.id }}" data-reply="always"><i class="ti ti-check-circle"></i>@(Always allow)</button>
							<button class="tbtn exec" data-exec="?/reply" data-id="{{ a.id }}" data-reply="reject"><i class="ti ti-times"></i>@(Reject)</button>
						</div>
					</div>
					{{ end }}
				</script>
			</ui-bind>

			<ui-bind path="?.questions" config="template" class="block">
				<script type="text/html">
					{{ foreach q in value }}
					<div class="message ask question">
						<b><i class="ti ti-question-circle"></i> {{ q.text }}</b>
						<div class="mt10">
							{{ foreach o in q.options }}
							<button class="tbtn exec" data-exec="?/answer" data-id="{{ q.id }}" data-answer="{{ o }}">{{ o }}</button>
							{{ end }}
						</div>
						<div class="row2 mt10"><input type="text" class="answertext" data-id="{{ q.id }}" placeholder="@(Type an answer)" /><button class="tbtn tbtn-primary exec" data-exec="?/answer" data-id="{{ q.id }}" data-custom="1">@(Answer)</button></div>
					</div>
					{{ end }}
				</script>
			</ui-bind>

		</div>
	</div>

	<ui-bind path="?.todos" config="template" class="block">
		<script type="text/html">
			{{ if value && value.length }}
			<div class="todos">
				{{ foreach t in value }}<div class="{{ t.status }}"><i class="ti ti-{{ if t.status === 'completed' }}circle-check{{ else }}circle{{ fi }}"></i> {{ t.text }}</div>{{ end }}
			</div>
			{{ fi }}
		</script>
	</ui-bind>

	<ui-bind path="?.commands" config="template" class="block">
		<script type="text/html">
			{{ if value && value.length }}
			<div class="chips"><span class="gray fs12">@(Commands:)</span>
				{{ foreach c in value }}<span class="exec chip" data-exec="?/usecommand" data-name="{{ c.name }}" title="{{ c.description }}">/{{ c.name }}</span>{{ end }}
			</div>
			{{ fi }}
		</script>
	</ui-bind>

	<div class="compose">
		<ui-bind path="?.attachments" config="template" class="block">
			<script type="text/html">
				{{ if value && value.length }}
				<div class="attached">
					{{ foreach a in value }}
					<div class="item">
						{{ if a.kind === 'image' }}<img src="{{ a.url }}" alt="" />{{ else }}<i class="ti ti-file-alt" style="font-size:20px;margin:0 4px"></i>{{ fi }}
						<span class="name" title="{{ a.name }}">{{ a.name }}</span>
						<span class="exec" data-exec="?/unattach" data-index="{{ $index }}" title="@(Remove)" style="cursor:pointer"><i class="ti ti-times"></i></span>
					</div>
					{{ end }}
				</div>
				{{ fi }}
			</script>
		</ui-bind>
		<ui-component name="enter" config="exec:?/send;validate:false;delay:0;timeout:400">
			<div class="card">
				<div class="row">
					<div class="grow"><ui-component name="input" path="?.text" config="placeholder:@(Ask Totem...);autofocus:true"></ui-component></div>
				</div>
				<div class="row opts">
					<button class="tbtn tbtn-ghost tbtn-icon exec" data-exec="?/attach" title="@(Attach images or text files)" aria-label="@(Attach images or text files)"><i class="ti ti-paperclip"></i></button>
					<ui-bind path="?.current" config="template" class="inline"><script type="text/html">{{ if value }}{{ value.icon | provicon(value.provider) }}{{ fi }}</script></ui-bind>
					<div class="model"><ui-component name="input" path="?.model" config="placeholder:@(Model);dirsource:?.models"></ui-component></div>
					<ui-bind path="?.thinks" config="show:value" class="hidden"><ui-component name="input" path="?.reasoning" config="placeholder:@(Reasoning);dirsource:?.efforts"></ui-component></ui-bind>
					<div class="mode"><ui-component name="input" path="?.mode" config="dirsource:?.modes;required:false"></ui-component></div>
					<ui-component name="input" path="?.autoaccept" config="type:checkbox">@(Auto-accept edits)</ui-component>
					<button name="send" class="tbtn tbtn-primary tbtn-icon exec send" data-exec="?/send" title="@(Send)" aria-label="@(Send)"><i class="ti ti-arrow-up"></i></button>
				</div>
			</div>
		</ui-component>
	</div>
	</div>

	<ui-bind path="?.showterm" config="show:value" class="hidden side termbox">
		<div class="shellbox">
			<div class="termhead">@(Shell)</div>
			<pre class="termout shellout"></pre>
			<div class="shellrow">
				<input type="text" class="shellinput" placeholder="@(Type a command and press Enter)" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="@(Type a command and press Enter)" />
				<button class="tbtn exec shellopen" data-exec="?/shellopen">@(Open shell)</button>
				<button class="tbtn exec shellkeys hidden" data-exec="?/shellkey" data-key="ctrlc" title="@(Interrupt the command, Ctrl+C)">@(Interrupt)</button>
				<button class="tbtn exec shellkeys hidden" data-exec="?/shellclose">@(Close)</button>
			</div>
		</div>
		<ui-bind path="?.jobs" config="template" class="block">
			<script type="text/html">
				{{ if value && value.length }}<div class="termhead">@(Running in the background)</div>{{ fi }}
				{{ foreach j in value }}
				<div class="termjob">
					<div class="termcmd"><i class="ti ti-terminal"></i> <b>{{ j.command }}</b> <span class="badge badge-small{{ if j.status === 'running' }} badge-orange{{ fi }}">{{ j.status }}</span> <span class="exec link" data-exec="?/stopjob" data-id="{{ j.id }}" style="{{ if j.status !== 'running' }}display:none{{ fi }}">@(Stop)</span></div>
					<pre class="termout">{{ j.output }}</pre>
				</div>
				{{ end }}
			</script>
		</ui-bind>
		<ui-bind path="?.items" config="template" class="block">
			<script type="text/html">
				{{ foreach m in value }}{{ foreach p in m.parts }}{{ if p.type === 'tool' && p.data.tool === 'bash' }}
				<div class="termjob">
					<div class="termcmd"><i class="ti ti-terminal"></i> <b>{{ p.data.input.command }}</b> <span class="st-{{ p.data.status }}">{{ p.data.status }}</span></div>
					{{ if p.data.output || p.data.error }}<pre class="termout">{{ p.data.error || p.data.output }}</pre>{{ fi }}
				</div>
				{{ fi }}{{ end }}{{ end }}
			</script>
		</ui-bind>
		<div class="gray termnote">@(Totem has not run any command in this session.)</div>
	</ui-bind>

	<ui-bind path="?.showdiff" config="show:value" class="hidden side">
		<ui-bind path="?.git" config="template" class="block">
			<script type="text/html">
				{{ if value && value.repository }}
				<div class="gitbox">
					<div class="gittop"><i class="ti ti-code-branch"></i> <b>{{ value.branch }}</b> <span class="gray">{{ value.files.length }} @(changed in git)</span></div>
					{{ foreach f in value.files }}<div class="gitfile"><span class="badge badge-small">{{ f.status }}</span> {{ f.path }}{{ if f.staged }} <span class="gray">@(staged)</span>{{ fi }}</div>{{ end }}
					{{ if value.more }}<div class="gray">+{{ value.more }}</div>{{ fi }}
					{{ if value.worktree }}
					<div class="gitwt">
						<div class="mb5">@(Worktree of this session. Base branch:) <b>{{ value.worktree.base }}</b> &middot; {{ value.worktree.ahead }} @(commits) &middot; {{ value.worktree.changes }} @(files not committed)</div>
						<div style="display:flex;gap:6px;flex-wrap:wrap">
							<button class="tbtn tbtn-small tbtn-primary exec" data-exec="?/wtmerge"><i class="ti ti-code-branch"></i>@(Merge into the project)</button>
							<button class="tbtn tbtn-small exec" data-exec="?/wtdiscard"><i class="ti ti-trash red"></i>@(Discard the worktree)</button>
						</div>
					</div>
					{{ fi }}
				</div>
				{{ fi }}
			</script>
		</ui-bind>
		<ui-bind path="?.splitmode" config="template" class="block">
			<script type="text/html">
				<div class="mb10" style="display:flex;gap:6px">
					<button class="tbtn tbtn-small exec{{ if !value }} tbtn-primary{{ fi }}" data-exec="?/diffmode" data-mode="unified">@(Unified)</button>
					<button class="tbtn tbtn-small exec{{ if value }} tbtn-primary{{ fi }}" data-exec="?/diffmode" data-mode="split">@(Split)</button>
				</div>
			</script>
		</ui-bind>
		<ui-bind path="?.files" config="template" class="block">
			<script type="text/html">
				{{ if !value || !value.length }}<div class="gray">@(Totem has not changed any file in this session.)</div>{{ fi }}
				{{ foreach f in value }}
				<details class="file" open>
					<summary><i class="ti ti-file"></i><b>{{ f.path }}</b><span class="badge badge-small">{{ f.status }}</span><span class="plus">+{{ f.additions }}</span><span class="minus">-{{ f.deletions }}</span></summary>
					{{ if f.split }}{{ f.patch | splitdiff }}{{ else }}<pre>{{ f.patch | diffhtml }}</pre>{{ fi }}
				</details>
				{{ end }}
			</script>
		</ui-bind>
	</ui-bind>
	</div>

</ui-plugin>

<script>

	PLUGIN(function(exports) {

		var sessionid = null;
		var parts = {};

		var diffjob = null;
		var rawfiles = [];
		var catalog = {};
		var registered = false;
		var EDITS = { write: 1, edit: 1, patch: 1 };

		var wired = false;

		exports.reload = function() {

			if (!wired) {
				wired = true;
				var box = document.getElementById('chatscroll');

				// Where the reader is, and which parts they opened: a redraw keeps both
				box.addEventListener('scroll', () => stick = nearbottom());
				box.addEventListener('toggle', function(e) {
					var id = e.target.tagName === 'DETAILS' && e.target.getAttribute('data-part');
					if (id && parts[id])
						parts[id].open = e.target.open;
				}, true);
			}

			exports.set('items', null);
			exports.set('attachments', []);
			exports.set('asks', []);
			exports.set('questions', []);
			exports.set('todos', []);
			exports.set('files', []);
			exports.models();

			exports.set('mode', 'build');
			exports.set('modes', [{ id: 'build', name: '@(Build)' }, { id: 'plan', name: '@(Plan)' }]);
			exports.set('efforts', [{ id: '', name: '@(Default)' }, { id: 'none', name: '@(Off)' }, { id: 'low', name: '@(Low)' }, { id: 'medium', name: '@(Medium)' }, { id: 'high', name: '@(High)' }]);

			if (!registered) {
				registered = true;

				// An image pasted into the prompt box, or files dropped on the chat
				document.addEventListener('paste', function(e) {
					if (!$(document.activeElement).closest('.compose').length || !e.clipboardData)
						return;
					var files = Array.from(e.clipboardData.files || []);
					if (files.length) {
						e.preventDefault();
						exports.addfiles(files);
					}
				});

				document.addEventListener('dragover', e => $(e.target).closest('.CLASS').length && e.preventDefault());
				document.addEventListener('drop', function(e) {
					if (!$(e.target).closest('.CLASS').length || !e.dataTransfer || !e.dataTransfer.files.length)
						return;
					e.preventDefault();
					exports.addfiles(e.dataTransfer.files);
				});

				exports.watch('model', exports.watchmodel);

				// Read the original code, not the highlighted DOM (the renderer expands tabs into spaces).
				function codeof(box) {
					var holder = box.closest('[data-part]');
					var part = parts[holder.attr('data-part')];
					var source = part && part.data.text;
					var blocks = [];
					var regex = /```[^\n]*\n([\s\S]*?)```/g;
					var match;
					while (source && (match = regex.exec(source)))
						blocks.push(match[1]);
					var index = holder.find('.markdown-code').index(box[0]);
					return index >= 0 && blocks[index] != null ? blocks[index] : box.find('pre code').text();
				}

				// Every code box of an answer has a button that copies its code
				var codes = null;
				function decorate() {
					codes = null;
					$('.CLASS .markdown-code').each(function() {
						if (this.querySelector('.copycode'))
							return;
						// A block that starts with its path as a comment (// schemas/system.js) can be saved as that file
						var first = codeof($(this)).split('\n')[0];
						var match = first.match(/^\s*(?:\/\/|<!--|#)\s*([A-Za-z0-9_@\-.\/]+\.[A-Za-z0-9]+)\s*(?::.*|-->)?\s*$/);
						if (!this.closest('.msg').querySelector('.validation')) {
							var save = document.createElement('button');
							save.type = 'button';
							save.className = 'saveblock';
							save.setAttribute('data-path', match && match[1].indexOf('..') === -1 ? match[1] : '');
							save.innerHTML = '<i class="ti ti-save"></i> @(Save this code to your project…)';
							this.appendChild(save);
						}
						var button = document.createElement('button');
						button.type = 'button';
						button.className = 'copycode';
						button.title = '@(Copy the code)';
						button.setAttribute('aria-label', '@(Copy the code)');
						button.innerHTML = '<i class="ti ti-clone"></i>';
						this.appendChild(button);
					});
				}

				var root = document.querySelector('.CLASS');
				root && new MutationObserver(function() {
					codes || (codes = setTimeout(decorate, 50));
				}).observe(root, { childList: true, subtree: true });

				$(document).on('click', '.CLASS .saveblock', function() {
					var button = $(this);
					var path = button.attr('data-path');
					var box = button.closest('.markdown-code');
					var message = box.closest('.msg').find('.undo [data-id]').first().attr('data-id');
					var content = codeof(box).replace(/\s+$/, '') + '\n';
					function save(replace) {
						exports.tapi('sessions_saveblock/' + sessionid + ' ERROR', { messageid: message, path: path, content: content, replace: replace }, function(response) {
							if (response.exists) {
								SETTER('approve/show', '@(Replace) ' + path + '? @(The old content stays in Undo.)', ':ti ti-save: @(Replace)', () => save(true));
								return;
							}
							SETTER('notify/success', '@(Saved) ' + response.path);
							button.html('<i class="ti ti-check"></i> @(Saved) ' + response.path);
						});
					}
					var opt = {};
					opt.name = '@(Save as)';
					opt.summary = '@(File path inside this project, for example public/demo.html)';
					opt.value = path || '';
					opt.newbie = true;
					opt.callback = function(value) {
						if (value && value.trim()) {
							path = value.trim();
							save(false);
						}
					};
					SETTER('prompt/show', opt);
				});

				$(document).on('click', '.CLASS .copycode', function() {
					var button = $(this);
					SETTER('clipboard/copy', codeof(button.closest('.markdown-code')));
					button.find('i').attr('class', 'ti ti-check');
					setTimeout(() => button.find('i').attr('class', 'ti ti-clone'), 1500);
				});
				SETTER(true, 'shortcuts/register', 'esc', function() {
					if (exports.model.status === 'running')
						exports.abort();
				});
				SETTER(true, 'shortcuts/register', 'alt + d', function() {
					exports.changes();
				});
			}
		};

		// A message that edited files can be undone
		function mark(m) {
			m.changed = (m.parts || []).some(function(p) {
				return p.type === 'tool' && EDITS[p.data.tool] && p.data.status === 'done';
			});
		}

		// The files with the view that is chosen: unified lines or two columns
		function showfiles() {
			var split = !!exports.model.splitmode;
			exports.set('files', rawfiles.map(f => Object.assign({}, f, { split: split })));
		}

		exports.diffmode = function(el) {
			var split = el.attrd('mode') === 'split';
			exports.set('splitmode', split);
			$('.side').tclass('wide', split);
			showfiles();
		};

		function refreshdiff() {
			diffjob && clearTimeout(diffjob);
			diffjob = setTimeout(function() {
				sessionid && exports.tapi('sessions_diff/' + sessionid, function(files) {
					rawfiles = files;
					showfiles();
				});
				sessionid && exports.tapi('sessions_git/' + sessionid, git => exports.set('git', git));
			}, 300);
		}

		// The reasoning control only makes sense for a model that thinks
		exports.watchmodel = function() {
			var m = catalog[exports.model.model];
			exports.set('thinks', !!(m && m.reasoning));
			exports.set('current', m ? { icon: m.icon, provider: m.provider, id: m.id } : null);
		};

		exports.models = function() {
			exports.tapi('providers_catalog', function(response) {
				catalog = {};
				exports.set('models', response.map(function(m) {
					catalog[m.id] = m;
					var notes = [];
					if (m.tools === false)
						notes.push('@(no tools)');
					if (m.free)
						notes.push('@(free)');
					if (m.reasoning)
						notes.push('@(thinks)');
					// A template per item: the icon of the provider and the name
					return { id: m.id, name: m.id + (notes.length ? (' · ' + notes.join(', ')) : ''), template: Thelpers.provicon(m.icon, m.provider) + ' <span style="margin-left:6px">{{ name }}</span>' };
				}));
				if (!exports.model.model && response.length)
					exports.set('model', response[0].id);
				exports.watchmodel();
			});
		};

		// The projects plugin opens a session
		exports.open = function(id) {
			sessionid = id;
			parts = {};
			exports.set('items', id ? [] : null);
			exports.set('asks', []);
			exports.set('questions', []);
			exports.set('todos', []);
			exports.set('files', []);
			exports.set('commands', []);
			exports.set('status', 'idle');
			exports.set('canredo', false);
			exports.set('session', null);

			if (!id)
				return;

			exports.models();
			exports.tapi('sessions_read/' + id + ' ERROR', function(session) {
				exports.set('session', session);
				exports.set('status', session.status);
				if (session.model)
					exports.set('model', session.model);
				exports.set('autoaccept', !!session.autoaccept);
				exports.set('mode', session.mode === 'plan' ? 'plan' : 'build');
				exports.set('canredo', !!session.redo);

				// Commands of the project: /name inserts the command in the prompt box
				exports.tapi('projects_commands/' + session.projectid, function(response) {
					exports.set('commands', response.commands);
				});
			});

			exports.tapi('sessions_todos/' + id, function(todos) {
				exports.set('todos', todos);
			});

			refreshdiff();
			exports.model.showterm && shellattach(false);

			exports.tapi('sessions_messages/' + id + ' ERROR', function(items) {
				for (var m of items) {
					for (var p of m.parts)
						parts[p.id] = p;
					mark(m);
				}
				exports.set('items', items);
				scroll(true);
			});

			online();
		};

		// Subscribes to the events of the session (again after a reconnect)
		function online() {
			sessionid && SETTER('websocket/send', { type: 'subscribe', sessionid: sessionid });
		}

		exports.online = online;

		// A notice of the system when Totem finishes or needs an answer while this tab is not in front. The browser asks for the permission
		// the first time the user sends a prompt.
		function notice(title, body) {
			try {
				if (document.hidden && window.Notification && Notification.permission === 'granted')
					new Notification(title, { body: body, tag: 'totem-' + sessionid, icon: '/img/totem-dark.svg' });
			} catch (e) {}
		}

		function allownotices() {
			try {
				if (window.Notification && Notification.permission === 'default')
					Notification.requestPermission();
			} catch (e) {}
		}

		// The chat follows the answer only while the reader is at the bottom: scrolling up stops it, going back down starts it again
		var stick = true;
		var dirty = {};
		var streamtimer = null;
		var fulltimer = null;

		function nearbottom() {
			var el = $('#chatscroll')[0];
			return !el || (el.scrollHeight - el.scrollTop - el.clientHeight) < 80;
		}

		function scroll(force) {

			if (force)
				stick = true;

			if (!stick)
				return;

			requestAnimationFrame(function() {
				var el = $('#chatscroll')[0];
				el && (el.scrollTop = el.scrollHeight);
			});
		}

		// The text that arrives while the model answers goes into the element of its part, a few times a second. The whole list is not drawn
		// again for every word: that is what made the screen jump and flicker.
		function flush() {

			var again = false;

			Object.keys(dirty).forEach(function(id) {

				var part = parts[id];
				var el = $('[data-part="' + id + '"]');

				if (!part || !el.length) {
					again = true;
					return;
				}

				if (part.type === 'text')
					el.text(part.data.text);
				else if (part.type === 'reasoning')
					el.find('.rtext').text(part.data.text);
			});

			dirty = {};
			again && exports.update('items', true);
			scroll();
		}

		function streamed(partid) {
			dirty[partid] = true;
			if (!streamtimer) {
				streamtimer = setTimeout(function() {
					streamtimer = null;
					flush();
				}, 90);
			}
		}

		// The rest of the changes (a tool that finished, a part that opened) are drawn together, not one by one
		function redraw() {
			if (!fulltimer) {
				fulltimer = setTimeout(function() {
					fulltimer = null;
					flush();
					exports.update('items', true);
					scroll();
				}, 120);
			}
		}

		function find(messageid) {
			return (exports.model.items || []).findItem('id', messageid);
		}

		// An event of the server (protocol.md)
		exports.event = function(msg) {

			if (msg.sessionid !== sessionid)
				return;

			var data = msg.data;
			var items = exports.model.items || [];

			switch (msg.type) {

				case 'session.status':
					exports.set('status', data.status);
					PLUGINS.projects && PLUGINS.projects.refresh();
					if (data.status === 'idle' || data.status === 'error')
						notice(data.status === 'error' ? '@(Totem stopped with an error)' : '@(Totem finished)', (exports.model.session && exports.model.session.name) || '');
					break;

				case 'message.created':
					if (!find(data.message.id)) {
						data.message.parts = [];
						items.push(data.message);
						exports.update('items', true);
					}
					scroll(true);
					break;

				case 'part.created':
					var m = find(data.part.messageid);
					if (m && !parts[data.part.id]) {
						data.part.live = data.part.type === 'text';
						parts[data.part.id] = data.part;
						m.parts.push(data.part);
						redraw();
					}
					break;

				case 'part.delta':
					var part = parts[data.partid];
					if (part) {
						part.data.text += data.text;
						streamed(data.partid);
					}
					break;

				case 'part.closed':
					// The text was shown as plain lines while it arrived; now it is drawn once as Markdown
					if (parts[data.partid] && parts[data.partid].live) {
						parts[data.partid].live = false;
						redraw();
					}
					break;

				case 'part.updated':
					var tool = parts[data.part.id];
					if (tool) {
						tool.data = data.part.data;
						var owner = find(tool.messageid);
						owner && mark(owner);
						redraw();
					}
					break;

				case 'session.updated':
					exports.set('session', data.session);
					PLUGINS.projects && PLUGINS.projects.refresh();
					break;

				case 'diff.updated':
					refreshdiff();
					break;

				case 'todo.updated':
					exports.set('todos', data.items);
					break;

				case 'question.ask':
					var questions = exports.model.questions || [];
					questions.push({ id: data.id, text: data.text, options: data.options || [] });
					exports.update('questions', true);
					scroll();
					break;

				case 'question.replied':
					exports.set('questions', (exports.model.questions || []).filter(function(q) { return q.id !== data.id; }));
					break;

				case 'permission.ask':
					var asks = exports.model.asks || [];
					asks.push({ id: data.id, tool: data.tool, text: data.patterns[0] || JSON.stringify(data.input) });
					notice('@(Totem needs your answer)', data.tool + ': ' + (data.patterns[0] || ''));
					exports.update('asks', true);
					scroll();
					break;

				case 'permission.replied':
					exports.set('asks', (exports.model.asks || []).filter(function(a) { return a.id !== data.id; }));
					break;

				case 'terminal.output':
					shellraw += data.text;
					if (shellraw.length > 100000)
						shellraw = shellraw.substring(shellraw.length - 100000);
					shellrender();
					break;

				case 'terminal.exit':
					shellstate(false);
					break;

				case 'error':
					SETTER('notify/warning', data.message);
					break;
			}
		};

		exports.send = function() {

			var model = exports.model;

			// Enter arrives before the input has copied its value to the model: the text is read from the input
			var input = $('.compose input[type="text"]').first();
			var typed = (input.val() || model.text || '').trim();

			if (!typed)
				return;

			// Without a session there is nothing to talk to: the folder of a project comes first
			if (!sessionid) {
				exports.nosession(typed);
				return;
			}

			model.text = typed;

			if (!model.model) {
				SETTER('notify/warning', '@(Choose a model first. Add a provider in Settings.)');
				return;
			}

			if (catalog[model.model] && catalog[model.model].tools === false)
				SETTER('notify/warning', '@(This model cannot use tools: it will only chat.)');

			var text = model.text;
			var attachments = (model.attachments || []).map(a => ({ name: a.name, mime: a.mime, data: a.data }));

			if (attachments.length && (model.attachments || []).some(a => a.kind === 'image') && catalog[model.model] && catalog[model.model].vision === false)
				SETTER('notify/warning', '@(This model cannot read images: it will only get a note.)');

			allownotices();
			input.val('');
			exports.set('text', '');
			exports.set('attachments', []);
			exports.tapi('sessions_prompt/' + sessionid + ' ERROR', { text: text, model: model.model, autoaccept: !!model.autoaccept, mode: model.mode === 'plan' ? 'plan' : 'build', reasoning: model.reasoning || '', attachments: attachments }, NOOP);
		};

		exports.abort = function() {
			sessionid && exports.tapi('sessions_abort/' + sessionid, NOOP);
		};

		// A prompt without a session: when a project is selected the session is created, otherwise the folder is asked for
		exports.nosession = function(typed) {

			var projectid = window.common && common.projectid;

			if (!projectid) {
				SETTER('notify/warning', '@(Open the folder of a project first.)');
				exports.folder();
				return;
			}

			exports.tapi('sessions_create ERROR', { projectid: projectid, model: exports.model.model || '' }, function(session) {
				PLUGINS.projects && PLUGINS.projects.session(session.id, projectid);
				exports.set('text', typed);
				$('.compose input[type="text"]').first().val(typed);
				setTimeout(exports.send, 50);
			});
		};

		exports.folder = function() {
			PLUGINS.projects && PLUGINS.projects.open();
		};

		// Files for the next prompt: images and text files, read in the browser and sent with the prompt
		var reading = 0;
		var TEXTEXT = /\.(txt|md|markdown|json|jsonc|js|mjs|cjs|ts|tsx|jsx|css|scss|less|html|htm|xml|svg|yml|yaml|toml|ini|sql|sh|bash|zsh|py|rb|php|java|kt|go|rs|c|h|cpp|hpp|cs|swift|csv|tsv|log|env|conf|config|gitignore|vue|svelte)$/i;
		var IMAGES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];

		exports.attach = function() {
			var opt = {};
			opt.multiple = true;
			opt.accept = 'image/png,image/jpeg,image/gif,image/webp,text/*,.md,.json,.js,.ts,.css,.html,.yml,.yaml,.sql,.sh,.py,.csv,.log,.xml,.txt';
			opt.callback = files => exports.addfiles(files);
			SETTER('filebrowser/show', opt);
		};

		exports.addfiles = function(files) {

			var list = exports.model.attachments || [];

			Array.from(files || []).forEach(function(file) {

				var image = IMAGES.indexOf(file.type) !== -1;
				var text = !image && (/^text\//.test(file.type) || file.type === 'application/json' || TEXTEXT.test(file.name));

				if (!image && !text) {
					SETTER('notify/warning', '@(This kind of file cannot be attached:) ' + file.name);
					return;
				}

				if (file.size > (image ? 5 * 1024 * 1024 : 200 * 1024)) {
					SETTER('notify/warning', '@(The file is too large:) ' + file.name);
					return;
				}

				if (list.length + reading >= 6) {
					SETTER('notify/warning', '@(Too many files: the limit is) 6');
					return;
				}

				var reader = new FileReader();
				reading++;

				reader.onload = function() {
					reading--;
					var url = reader.result;
					var current = exports.model.attachments || [];
					current.push({ name: file.name, mime: file.type || 'text/plain', kind: image ? 'image' : 'text', size: file.size, data: url.substring(url.indexOf(',') + 1), url: image ? url : '' });
					exports.set('attachments', current.slice());
				};

				reader.readAsDataURL(file);
			});
		};

		exports.unattach = function(el) {
			var current = (exports.model.attachments || []).slice();
			current.splice(+el.attrd('index'), 1);
			exports.set('attachments', current);
		};

		exports.usecommand = function(el) {
			exports.set('text', '/' + el.attrd('name') + ' ');
		};

		// The terminal shows the commands that Totem ran in this session, and the ones that run in the background (read again while it is open)
		var termjob = null;

		function refreshjobs() {
			termjob && clearTimeout(termjob);
			termjob = null;
			if (!exports.model.showterm || !sessionid)
				return;
			exports.tapi('sessions_jobs/' + sessionid, function(jobs) {
				exports.set('jobs', jobs);
				termjob = setTimeout(refreshjobs, 2000);
			});
		}

		exports.sidebar = function() {
			$('.app').toggleClass('side-open');
		};

		// What is not used all the time: one menu, so that a new utility is one more entry and not one more button
		exports.more = function(el) {
			var opt = {};
			opt.element = el;
			opt.align = 'right';
			opt.items = [];
			opt.items.push({ id: 'settings', name: '@(Session settings)', icon: 'ti ti-sliders-h' });
			opt.items.push({ id: 'agents', name: '@(Agents)', icon: 'ti ti-users' });
			opt.callback = function(item) {
				if (item.id === 'settings')
					exports.workspace();
				else if (item.id === 'agents')
					exports.agents();
			};
			SETTER('menu/show', opt);
		};

		// The settings of the session, of its project and of all projects (the defaults come from the file config)
		exports.workspace = function() {
			var sessionid = window.common && common.sessionid;
			if (!sessionid)
				return;
			var current = exports.model.session || {};
			SET('formconfig @reset', { scope: 'session', sessionid: sessionid, projectid: current.projectid || '', rows: [] });
			SET('common.form', 'formconfig');
		};

		// The agents of the project (and of all projects) that the agent can hand a task to
		exports.agents = function() {
			var current = exports.model.session || {};
			SET('formagents @reset', { ready: true, projectid: current.projectid || '', items: [], tools: [], models: [], edit: null });
			SET('common.form', 'formagents');
		};

		exports.terminal = function() {
			var show = !exports.model.showterm;
			exports.set('showterm', show);
			show && exports.set('showdiff', false);
			refreshjobs();
			show && shellattach(false);
		};

		// The interactive shell: a terminal of the user in the project folder. It lives on the server, so a reload opens it again with its output.
		var shellraw = '';
		var shellon = false;

		function shellplain(raw) {
			var text = raw.replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, '').replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, '').replace(/\x1b[()][0-9A-Za-z]/g, '').replace(/\x1b[=>78]/g, '').replace(/\r\n/g, '\n');
			var out = [];
			text.split('\n').forEach(function(line) {
				var segments = line.split('\r');
				var current = '';
				segments.forEach(function(segment) {
					current = segment.length >= current.length ? segment : (segment + current.substring(segment.length));
				});
				while (/[^\x08]\x08/.test(current))
					current = current.replace(/[^\x08]\x08/, '');
				out.push(current.replace(/\x08/g, ''));
			});
			return out.join('\n');
		}

		function shellrender() {
			var el = $('.CLASS .shellout');
			if (!el.length)
				return;
			el.text(shellplain(shellraw));
			el[0].scrollTop = el[0].scrollHeight;
		}

		function shellstate(on) {
			shellon = on;
			$('.CLASS .shellopen').toggleClass('hidden', on);
			$('.CLASS .shellkeys').toggleClass('hidden', !on);
		}

		function shellsize() {
			var el = $('.CLASS .shellout');
			var width = el.length ? el[0].clientWidth : 0;
			return { columns: Math.max(40, Math.floor((width || 340) / 7.3)), rows: 24 };
		}

		function shellsend(text) {
			if (!shellon || !sessionid)
				return;
			exports.tapi('sessions_terminalinput/' + sessionid, { data: btoa(unescape(encodeURIComponent(text))) });
		}

		// Reattaches to the shell of the session when it exists (after a reload or when another session is opened)
		function shellattach(start) {
			shellraw = '';
			shellrender();
			shellstate(false);
			if (!sessionid)
				return;
			var size = shellsize();
			exports.tapi('sessions_terminal/' + sessionid, { start: !!start, columns: size.columns, rows: size.rows }, function(response) {
				shellraw = response.output || '';
				shellstate(response.status === 'running');
				shellrender();
			});
		}

		exports.shellopen = function() {
			shellattach(true);
			setTimeout(function() {
				$('.CLASS .shellinput').focus();
			}, 100);
		};

		exports.shellclose = function() {
			exports.tapi('sessions_terminalstop/' + sessionid, function() {
				shellstate(false);
			});
		};

		exports.shellkey = function(el) {
			$(el).attr('data-key') === 'ctrlc' && shellsend('\x03');
		};

		$(document).on('keydown', '.CLASS .shellinput', function(e) {
			var input = e.target;
			if (e.key === 'Enter') {
				shellsend(input.value + '\n');
				input.value = '';
			}
			else if (e.key === 'Tab') {
				shellsend(input.value + '\t');
				input.value = '';
			}
			else if (e.key === 'ArrowUp' && !input.value)
				shellsend('\x1b[A');
			else if (e.key === 'ArrowDown' && !input.value)
				shellsend('\x1b[B');
			else if (e.key === 'c' && e.ctrlKey && !input.value)
				shellsend('\x03');
			else
				return;
			e.preventDefault();
		});

		exports.stopjob = function(el) {
			exports.tapi('sessions_jobstop/' + sessionid + ' ERROR', { job: ATTRD(el) }, refreshjobs);
		};

		// The worktree of the session: merge its branch into the project, or throw it away
		exports.wtmerge = function() {
			SETTER('approve/show', '@(Commit what this session left in its worktree and merge the branch into the project?)', ':ti ti-code-branch: @(Merge)', function() {
				exports.tapi('sessions_worktreemerge/' + sessionid + ' ERROR', function() {
					SETTER('notify/success', '@(Merged into the project)');
					refreshdiff();
				});
			});
		};

		exports.wtdiscard = function() {
			SETTER('approve/show', '@(Discard the worktree and its branch? What was not merged is lost.)', ':ti ti-trash: @(Discard)', function() {
				exports.tapi('sessions_worktreediscard/' + sessionid + ' ERROR', function() {
					SETTER('notify/success', '@(Worktree discarded)');
					refreshdiff();
				});
			});
		};

		exports.changes = function() {
			exports.set('showdiff', !exports.model.showdiff);
			exports.model.showdiff && exports.set('showterm', false);
			refreshdiff();
		};

		exports.undo = function(el) {
			var id = ATTRD(el);
			SETTER('approve/show', '@(Restore the files as they were before these changes?)', ':ti ti-undo: @(Undo)', function() {
				exports.tapi('sessions_undo/' + sessionid + ' ERROR', { messageid: id }, function(restored) {
					SETTER('notify/success', '@(Restored files:) ' + restored.length);
					exports.set('canredo', restored.length > 0);
					refreshdiff();
				});
			});
		};

		exports.redo = function() {
			exports.tapi('sessions_redo/' + sessionid + ' ERROR', function(restored) {
				SETTER('notify/success', '@(Restored files:) ' + restored.length);
				exports.set('canredo', false);
				refreshdiff();
			});
		};

		exports.fork = function(el) {
			exports.tapi('sessions_fork/' + sessionid + ' ERROR', { messageid: ATTRD(el) }, function(session) {
				PLUGINS.projects && PLUGINS.projects.refresh();
				SET('common.sessionid', session.id);
				exports.open(session.id);
			});
		};

		exports.answer = function(el) {
			var id = ATTRD(el);
			var answer = el.attrd('answer');
			if (el.attrd('custom'))
				answer = el.closest('.question').find('.answertext').val();
			if (answer)
				exports.tapi('questions_reply/' + id + ' ERROR', { answer: answer }, NOOP);
		};

		exports.reply = function(el) {
			var id = ATTRD(el);
			exports.tapi('permissions_reply/' + id + ' ERROR', { reply: el.attrd('reply') }, NOOP);
		};

	});

</script>
