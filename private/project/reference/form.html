<ui-component name="miniform" path="common.form" config="if:~PATH~;icon:ti ti-check-circle;title:@(Task);autofocus:true;submit:?/submit;width:420" class="hidden" plugin="~PATH~">
	<div class="padding">
		<div class="m">
			<ui-component name="input" path="?.name" config="required:1;maxlength:100">@(Name)</ui-component>
		</div>
		<ui-component name="input" path="?.note" config="type:multiline;height:80">@(Note)</ui-component>
	</div>
	<nav>
		<ui-component name="validate" path="?">
			<button name="submit" disabled><i class="ti ti-check-circle"></i>@(SUBMIT)</button>
			<button name="cancel">@(Cancel)</button>
		</ui-component>
	</nav>
</ui-component>

<script>

	PLUGIN(function(exports) {

		exports.submit = function(hide) {
			var model = exports.model;
			exports.tapi('tasks_save ERROR', { id: model.id, name: model.name, note: model.note }, function() {
				hide();
				PLUGINS.tasks.refresh();
			});
		};

	});

</script>
