<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="Spanish Total.js">
<meta name="theme-color" content="#fff9f2">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website"><meta property="og:site_name" content="Total.js Totem"><meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:url" content="{{canonical}}"><meta property="og:image" content="{{origin}}img/og.jpg"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="{{root}}img/toto/favicon-64.png" sizes="64x64">
<link rel="shortcut icon" href="{{root}}img/toto/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="{{root}}img/toto/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.totaljs.es" crossorigin>
<link rel="stylesheet" href="https://cdn.totaljs.es/ui/1.6.2/web.min.css" integrity="sha384-DyMJUUxNS3z5q9qL29iO3keTXmH/AP3gGKKIYwIjbJ/CvaL/DOUHLS5hGtgcYidU" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.totaljs.es/ui/1.6.2/icons-web.min.css" integrity="sha384-TsZFOZwnwMau9JlPOj6inl834pgXLc7kuPXzORGS1sSlf4T10NBQGIlG91rGr7iz" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.totaljs.es/ui/1.6.2/web-shell.min.css" integrity="sha384-BcGT6mQwzzL8gKCnTj6WX6tgR099RE8gGKHAagx2JnR50d+SO+gAeihAzJOs3++P" crossorigin="anonymous">
<link rel="stylesheet" href="{{root}}css/corp.css">
<link rel="stylesheet" href="{{root}}site.css">
<script src="{{root}}site.js" defer></script>
</head>
<body class="st-site toto-site">
<a href="#maincontent" class="skiplink">Skip to main content</a>
{{header}}
<main id="maincontent" tabindex="-1">

<div class="t-wrap doc-wrap">
 <nav class="doc-menu" aria-label="Documentation">{{menu}}</nav>
 <article class="doc">
{{body}}
{{neighbours}}
  <p class="doc-edit"><a href="{{edit}}">Edit this page on GitHub</a></p>
 </article>
 {{aside}}
</div>
</main>
{{footer}}
</body>
</html>
